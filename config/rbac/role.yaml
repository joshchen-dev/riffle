---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts/status
  verbs:
  - get
  - patch
  - update
