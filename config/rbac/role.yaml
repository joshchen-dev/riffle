---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts/finalizers
  verbs:
  - update
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts/status
  verbs:
  - get
  - patch
  - update
