name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - run: make lint-config lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: unit + envtest
        run: make test
      - name: generated files up to date
        run: git diff --exit-code
      - name: manifests render
        run: make kustomize && bin/kustomize build config/default >/dev/null && bin/kustomize build config/agent >/dev/null && bin/kustomize build deploy/riffle >/dev/null && bin/kustomize build deploy/rules >/dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: make docker-build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false
      - name: fmt, validate
        working-directory: terraform/archive
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: syntax check
        working-directory: ansible
        run: |
          pipx install ansible-core==2.22.0
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook --syntax-check -i inventory.example.yml site.yml

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: feat/fix PRs bump VERSION
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! [[ "$TITLE" =~ ^(feat|fix)(\(.+\))?!?: ]]; then echo "not feat/fix"; exit 0; fi
          old=$(git show "$BASE:VERSION")
          new=$(cat VERSION)
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION '$new' is not semver"; exit 1; }
          if [ "$old" = "$new" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "VERSION must be bumped above $old (got $new)"; exit 1
          fi
          echo "VERSION $old -> $new"
