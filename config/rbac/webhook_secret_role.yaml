# Read only the webhook Secret, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: riffle
    app.kubernetes.io/managed-by: kustomize
  name: webhook-secret-reader
  namespace: system
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [riffle-webhook]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: riffle
    app.kubernetes.io/managed-by: kustomize
  name: webhook-secret-reader
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-secret-reader
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
