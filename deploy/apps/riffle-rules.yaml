apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riffle-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joshchen-dev/riffle.git
    targetRevision: feat/gitops
    path: deploy/rules
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true # LogAlert CRD comes from the riffle app
    retry:
      limit: 10
      backoff:
        duration: 10s
