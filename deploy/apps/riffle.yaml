apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riffle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joshchen-dev/riffle.git
    targetRevision: feat/gitops
    path: deploy/riffle
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true # the CRD is too big for client-side apply's annotation
