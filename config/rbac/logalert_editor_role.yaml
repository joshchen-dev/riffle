# This rule is not used by the project riffle itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the riffle.jhchen.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: riffle
    app.kubernetes.io/managed-by: kustomize
  name: logalert-editor-role
rules:
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - riffle.jhchen.dev
  resources:
  - logalerts/status
  verbs:
  - get
