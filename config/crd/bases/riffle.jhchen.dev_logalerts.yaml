                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              suspend:
                description: suspend stops matching without deleting the rule.
                type: boolean
              threshold:
                description: threshold fires the alert when matches in window reach
