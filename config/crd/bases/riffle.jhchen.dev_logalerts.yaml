              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LogAlert
            properties:
              container:
                description: container limits matching to one container. Empty means
                  all.
                type: string
              match:
                description: match is an RE2 regex tested against the raw line.
                maxLength: 1024
                minLength: 1
                type: string
              redact:
                description: redact lists RE2 regexes replaced with [REDACTED] in
